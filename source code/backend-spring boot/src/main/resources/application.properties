server.port=${SERVER_PORT:5454}

#db specific properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:9999/ecommerce_multi_vendor}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}


#ORM s/w specific properties
#spring.jpa.properties.hibernate.hbm2ddl.auto=update
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true

razorpay.api.key=${RAZORPAY_API_KEY:dummy_key}
razorpay.api.secret=${RAZORPAY_API_SECRET:dummy_secret}

stripe.api.key=${STRIPE_API_KEY:dummy_key}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:youremail@gmail.com}
spring.mail.password=${MAIL_APP_PASSWORD:}
#if needed search on youtube how to generate app password in gmail
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.devtools.livereload.enabled=true

#ai
gemini.api.key=${GEMINI_API_KEY:dummy_key}

# JWT (min 32 chars ka strong secret rakho, prod me env se aayega)
jwt.secret=${JWT_SECRET:changeme_change_me_to_32_plus_chars_long_secret}

# Frontend URL (CORS ke liye, prod me env se aayega)
frontend.url=${FRONTEND_URL:http://localhost:5173}
